name: Build MOON X7 YT Trial IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'redesign/moonx7-liquid-glass', 'version-yt-prueba']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          sw_vers
          uname -a
          uname -m
          xcode-select -p
          xcodebuild -version
          git --version
          df -h
          pwd
          ls -la

      - name: Locate exact project
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PROJECT="$GITHUB_WORKSPACE/ThreeOneOSFive.xcodeproj"
          SOURCE_ROOT="$GITHUB_WORKSPACE"
          BUILD_SOURCE="$SOURCE_ROOT/ThreeOneOSFive/ContentView.swift"

          [ -d "$ROOT_PROJECT" ] || { echo "ERROR: root Xcode project missing: $ROOT_PROJECT"; find "$GITHUB_WORKSPACE" -name '*.xcodeproj' -print; exit 1; }
          [ -f "$BUILD_SOURCE" ] || { echo "ERROR: ContentView missing: $BUILD_SOURCE"; exit 1; }

          NESTED_PROJECTS="$(find "$GITHUB_WORKSPACE/ThreeOneOSFive" -type d -name 'ThreeOneOSFive.xcodeproj' -print 2>/dev/null || true)"
          [ -z "$NESTED_PROJECTS" ] || { echo "ERROR: nested project detected"; printf '%s\n' "$NESTED_PROJECTS"; exit 1; }

          echo "PROJECT=$ROOT_PROJECT" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_SOURCE=$BUILD_SOURCE" >> "$GITHUB_ENV"
          echo "Building exact project: $ROOT_PROJECT"

      - name: Validate redesigned source and resources
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MoonPatchRedesignCard" "$BUILD_SOURCE" || { echo "ERROR: redesigned patch cards missing"; exit 1; }
          grep -q "MoonPreviewRedesign" "$BUILD_SOURCE" || { echo "ERROR: redesigned preview missing"; exit 1; }
          grep -q "MoonX7RedesignedShell(auth: auth" "$BUILD_SOURCE" || { echo "ERROR: redesigned shell is not the active authenticated UI"; exit 1; }
          grep -q "case 1: MoonFunctionsRedesign" "$BUILD_SOURCE" || { echo "ERROR: redesigned functions screen is not active"; exit 1; }
          grep -q "durationDays" "$BUILD_SOURCE" || { echo "ERROR: license metadata missing"; exit 1; }
          grep -q "YT LIMITED EDITION" "$BUILD_SOURCE" || { echo "ERROR: YT trial build marker missing"; exit 1; }
          grep -q 'yt-ffn-drag-atn' "$BUILD_SOURCE" || { echo "ERROR: YT FF Normal Drag ATN missing"; exit 1; }
          grep -q 'yt-ffn-drag"' "$BUILD_SOURCE" || { echo "ERROR: YT FF Normal Drag missing"; exit 1; }
          grep -q 'yt-ffn-arm-holo' "$BUILD_SOURCE" || { echo "ERROR: YT FF Normal Holo ARM missing"; exit 1; }
          grep -q 'yt-ffmx-drag-atn' "$BUILD_SOURCE" || { echo "ERROR: YT FF Max Drag ATN missing"; exit 1; }
          grep -q 'yt-ffmx-drag"' "$BUILD_SOURCE" || { echo "ERROR: YT FF Max Drag missing"; exit 1; }
          grep -q 'yt-ffmx-arm-holo' "$BUILD_SOURCE" || { echo "ERROR: YT FF Max Holo ARM missing"; exit 1; }
          grep -q 'KEY DE PRUEBA GRATIS' "$BUILD_SOURCE" || { echo "ERROR: trial key login button missing"; exit 1; }
          grep -q 'COMPRAR VIP • WHATSAPP' "$BUILD_SOURCE" || { echo "ERROR: VIP WhatsApp login button missing"; exit 1; }
          grep -q 'https://discord.gg/hD6qXCtXm' "$BUILD_SOURCE" || { echo "ERROR: Discord link missing"; exit 1; }

          PATCHES_DIR="$SOURCE_ROOT/ThreeOneOSFive/Patches"
          PREVIEW_DIR="$SOURCE_ROOT/ThreeOneOSFive/PreviewVideos"
          BANNER_FILE="$SOURCE_ROOT/ThreeOneOSFive/realm-banner.gif"

          [ -d "$PATCHES_DIR" ] || { echo "ERROR: patches directory missing"; exit 1; }
          PATCH_COUNT="$(find "$PATCHES_DIR" -type f -name '*.3105' | wc -l | tr -d ' ')"
          echo "Patch count: $PATCH_COUNT"
          [ "$PATCH_COUNT" -ge 16 ] || { echo "ERROR: expected at least 11 .3105 resources after FF MAX replacement"; exit 1; }

          echo "ContentView SHA256:"
          shasum -a 256 "$BUILD_SOURCE"

      - name: Clean build directory and Build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            SYMROOT="$GITHUB_WORKSPACE/build/sym" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          test ${PIPESTATUS[0]} -eq 0

      - name: Verify compiled UI is the redesigned build
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/Release-iphoneos/MOONX7.app"
          EXEC="$APP_PATH/MOONX7"
          [ -d "$APP_PATH" ] || { echo "ERROR: exact MOONX7.app missing"; find "$GITHUB_WORKSPACE/build" -type d -name '*.app' -print || true; exit 1; }
          [ -f "$EXEC" ] || { echo "ERROR: MOONX7 executable missing"; exit 1; }

          strings "$EXEC" > "$GITHUB_WORKSPACE/compiled-strings.txt"
          grep -Fq "LIQUID GLASS EDITION" "$GITHUB_WORKSPACE/compiled-strings.txt" || {
            echo "ERROR: compiled executable is missing the unique MOON X7 redesign build stamp"
            exit 1
          }
          echo "Compiled UI verification PASSED: unique redesign build stamp is embedded"
          shasum -a 256 "$EXEC"

      - name: Package IPA with patches and previews
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/Release-iphoneos/MOONX7.app"
          [ -d "$APP_PATH" ] || { echo "ERROR: exact MOONX7.app missing"; exit 1; }

          APP_NAME="MOONX7.app"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload/$APP_NAME"
          ditto "$APP_PATH/" "$GITHUB_WORKSPACE/Payload/$APP_NAME/"

          DEST_APP="$GITHUB_WORKSPACE/Payload/$APP_NAME"
          PATCHES_DIR="$SOURCE_ROOT/ThreeOneOSFive/Patches"
          PREVIEW_DIR="$SOURCE_ROOT/ThreeOneOSFive/PreviewImages"
          BANNER_FILE="$SOURCE_ROOT/ThreeOneOSFive/realm-banner.gif"

          mkdir -p "$DEST_APP/Patches"
          [ ! -d "$PATCHES_DIR/FF Normal" ] || { mkdir -p "$DEST_APP/Patches/FF Normal"; ditto "$PATCHES_DIR/FF Normal/" "$DEST_APP/Patches/FF Normal/"; }
          [ ! -d "$PATCHES_DIR/FF Max" ] || { mkdir -p "$DEST_APP/Patches/FF Max"; ditto "$PATCHES_DIR/FF Max/" "$DEST_APP/Patches/FF Max/"; }
          find "$PATCHES_DIR" -maxdepth 1 -type f -name '*.3105' -exec cp -f {} "$DEST_APP/Patches/" \;

          if [ -d "$PREVIEW_DIR" ]; then
            mkdir -p "$DEST_APP/PreviewImages"
            ditto "$PREVIEW_DIR/" "$DEST_APP/PreviewImages/"
          fi
          [ ! -f "$BANNER_FILE" ] || cp -f "$BANNER_FILE" "$DEST_APP/realm-banner.gif"

          PATCH_COUNT="$(find "$DEST_APP/Patches" -type f -name '*.3105' | wc -l | tr -d ' ')"
          [ "$PATCH_COUNT" -ge 16 ] || { echo "ERROR: packaged patch count is $PATCH_COUNT"; exit 1; }

          for video in             "PJ HOLO MOON COTTON CANDY.mp4"             "PJ HOLO MOON DARK GALAXY.mp4"             "PJ HOLO MOON ESPEJOS.mp4"; do
            [ -f "$DEST_APP/PreviewImages/$video" ] || { echo "ERROR: missing preview video: $video"; exit 1; }
          done

          cd "$GITHUB_WORKSPACE"
          IPA_NAME="MOON-X7-YT-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.ipa"
          rm -f "$IPA_NAME"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          [ -f "$IPA_NAME" ] || { echo "ERROR: IPA not created"; exit 1; }

          rm -rf "$GITHUB_WORKSPACE/IPA_VERIFY"
          mkdir -p "$GITHUB_WORKSPACE/IPA_VERIFY"
          unzip -q "$IPA_NAME" -d "$GITHUB_WORKSPACE/IPA_VERIFY"
          VERIFY_EXEC="$GITHUB_WORKSPACE/IPA_VERIFY/Payload/MOONX7.app/MOONX7"
          [ -f "$VERIFY_EXEC" ] || { echo "ERROR: packaged executable missing"; exit 1; }
          strings "$VERIFY_EXEC" > "$GITHUB_WORKSPACE/ipa-compiled-strings.txt"
          grep -Fq "LIQUID GLASS EDITION" "$GITHUB_WORKSPACE/ipa-compiled-strings.txt" || {
            echo "ERROR: IPA contains wrong/old binary; Liquid Glass redesign marker is missing"
            exit 1
          }

          echo "FINAL IPA VERIFICATION PASSED: unique redesign build stamp is inside the IPA"
          shasum -a 256 "$IPA_NAME"
          ls -lh "$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: MOON-X7-YT-${{ github.run_number }}-${{ github.sha }}
          path: MOON-X7-YT-*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
